# Function config. The three public facility endpoints are token-verified
# (facility_links) instead of JWT-verified — see _shared/publicAuth.ts.
#
# AUTH SETTINGS ARE NOT IN THIS FILE, DELIBERATELY. Signup policy, password
# length, Site URL, redirect URLs, and the custom SMTP relay for auth email
# all live in the Supabase dashboard (see docs/LAUNCH_CHECKLIST.md).
#
# Do not add an [auth] or [auth.email.smtp] block here without first
# reconstructing the WHOLE auth section. `supabase config push` sends this
# file as the complete config and has no --dry-run: any auth key absent from
# it is pushed as a CLI default, not as the project's current value. Adding a
# partial [auth] block and pushing would silently flip `enable_signup` back
# to true on an invite-only portal and drop the minimum password length from
# 12 to 6. There is no `supabase config pull` to recover those values.
#
# Enabling [auth.email.smtp] here would also route LOCAL `supabase start`
# mail through the live SendGrid account, so dev invites would hit real
# inboxes instead of the local catcher.
[functions.public-portal]
verify_jwt = false

[functions.public-upload]
verify_jwt = false

[functions.submit-content]
verify_jwt = false
